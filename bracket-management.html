<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket Management - GDINFMG Esports</title>

  <!-- Bulma CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

  <style>
    body {
      background: #0d1117;
      color: #ffffff;
    }

    .hero {
      background: linear-gradient(180deg, #111827, #0d1117);
    }

    .navbar {
      background-color: #1f2937 !important;
    }

    .navbar-item, .navbar-link {
      color: #fff !important;
    }

    footer {
      background: #111827;
      padding: 2rem;
      color: #aaa;
    }

    /* Bracket visualization styles */
    .bracket-container {
      display: flex;
      gap: 4rem;
      overflow-x: auto;
      padding: 2rem;
      background: #1a1a1a;
      border-radius: 8px;
      position: relative;
    }

    .bracket-round {
      display: flex;
      flex-direction: column;
      min-width: 250px;
      position: relative;
    }

    .bracket-round-title {
      font-weight: bold;
      text-align: center;
      color: #fff;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .bracket-round-matches {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }

    .matchup-wrapper {
      position: relative;
      margin-bottom: 0;
    }

    .matchup {
      background: #2a2a2a;
      border: 2px solid #444;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s;
      position: relative;
      padding: 10px;
      min-width: 250px;
    }

    .matchup:hover {
      border-color: #00d1b2;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 209, 178, 0.2);
      z-index: 10;
    }

    /* Connector lines */
    .matchup-wrapper::before,
    .matchup-wrapper::after {
      content: '';
      position: absolute;
      border: 2px solid #444;
    }

    /* Horizontal line going right */
    .matchup-wrapper::before {
      width: 2rem;
      height: 0;
      top: 50%;
      right: -2rem;
      border-top: 2px solid #555;
      border-right: none;
      border-bottom: none;
      border-left: none;
    }

    /* Vertical connecting line */
    .matchup-wrapper.connect-down::after {
      width: 0;
      top: 50%;
      right: -2rem;
      border-left: 2px solid #555;
      border-right: none;
      border-top: none;
      border-bottom: none;
    }

    .matchup-wrapper.connect-up::after {
      width: 0;
      bottom: 50%;
      right: -2rem;
      border-left: 2px solid #555;
      border-right: none;
      border-top: none;
      border-bottom: none;
    }

    /* Spacer between matchup pairs */
    .matchup-spacer {
      height: 3rem;
    }

    /* Hide connectors on final round */
    .bracket-round:last-child .matchup-wrapper::before,
    .bracket-round:last-child .matchup-wrapper::after {
      display: none;
    }

    .matchup-header {
      font-size: 12px;
      color: #a0aec0;
      margin-bottom: 8px;
    }

    .participant-row {
      background: #1a202c;
      border: 1px solid #4a5568;
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .participant-row.winner {
      border-color: #48bb78;
      background: #1a3a24;
    }

    .participant-name {
      font-weight: 500;
      color: #fff;
    }

    .participant-seed {
      color: #a0aec0;
      font-size: 12px;
      margin-right: 8px;
    }

    .participant-score {
      font-weight: bold;
      color: #48bb78;
      min-width: 30px;
      text-align: right;
    }

    .tbd {
      color: #718096;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation">
    <div class="navbar-brand">
      <a class="navbar-item has-text-weight-bold" href="index.html">GDINFMG Esports</a>
    </div>
    <div class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item" href="index.html">Home</a>
        <a class="navbar-item" href="tournament-management.html">Tournament Management</a>
        <a class="navbar-item" href="participant-management.html">Participant Management</a>
        <a class="navbar-item" href="bracket-management.html">Bracket Management</a>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero is-small">
    <div class="hero-body">
      <div class="container">
        <h1 class="title has-text-white">Bracket Management</h1>
        <h2 class="subtitle has-text-grey-light">
          Create and manage tournament brackets
        </h2>
      </div>
    </div>
  </section>

  <!-- CONTENT SECTION -->
  <section class="section">
    <div class="container">

      <!-- SELECT TOURNAMENT AND EVENT -->
      <div class="box has-background-grey-dark mb-5">
        <h3 class="title is-4 has-text-white">Select Event</h3>
        
        <div class="field">
          <label class="label has-text-white">Tournament</label>
          <div class="control">
            <div class="select is-fullwidth">
              <select id="tournament-select">
                <option value="">Loading tournaments...</option>
              </select>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label has-text-white">Event</label>
          <div class="control">
            <div class="select is-fullwidth">
              <select id="event-select" disabled>
                <option value="">Select a tournament first</option>
              </select>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="control">
            <button class="button is-primary" id="load-bracket-btn" disabled>Load/Create Bracket</button>
          </div>
        </div>
      </div>

      <!-- BRACKET INFO AND CONTROLS -->
      <div class="box has-background-grey-dark mb-5" id="bracket-info-section" style="display: none;">
        <h3 class="title is-4 has-text-white">Bracket Information</h3>
        <div id="bracket-info">
          <p class="has-text-white">Loading bracket information...</p>
        </div>
        
        <div id="create-bracket-section" style="display: none;">
          <hr class="has-background-grey">
          <h4 class="title is-5 has-text-white">Create New Bracket</h4>
          
          <div class="field">
            <label class="label has-text-white">Bracket Type</label>
            <div class="control">
              <div class="select is-fullwidth">
                <select id="bracket-type-select">
                  <option value="single">Single Elimination</option>
                  <option value="double">Double Elimination</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field">
            <div class="control">
              <button class="button is-success" id="create-bracket-btn">Generate Bracket</button>
            </div>
          </div>
        </div>
      </div>

      <!-- BRACKET VISUALIZATION -->
      <div class="box has-background-grey-dark" id="bracket-display-section" style="display: none;">
        <div class="level">
          <div class="level-left">
            <div class="level-item">
              <h3 class="title is-4 has-text-white">Bracket</h3>
            </div>
          </div>
          <div class="level-right">
            <div class="level-item">
              <button class="button is-danger is-small" id="delete-bracket-btn">Delete Bracket</button>
            </div>
          </div>
        </div>
        
        <div id="bracket-display" class="bracket-container">
          <!-- Bracket will be rendered here -->
        </div>
      </div>

    </div>
  </section>

  <!-- MODAL FOR MATCHUP RESULTS -->
  <div class="modal" id="result-modal">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head has-background-grey-dark">
        <p class="modal-card-title has-text-white">Enter Match Result</p>
        <button class="delete" aria-label="close" id="close-modal-btn"></button>
      </header>
      <section class="modal-card-body has-background-grey-dark">
        <div id="modal-content">
          <!-- Dynamic content will be inserted here -->
        </div>
      </section>
      <footer class="modal-card-foot has-background-grey-dark">
        <button class="button is-success" id="save-result-btn">Save Result</button>
        <button class="button" id="cancel-modal-btn">Cancel</button>
      </footer>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer has-text-centered">
    <p>© <span id="year"></span> GDINFMG Esports Tournament Website</p>
  </footer>

  <!-- load frontend as ESM module -->
  <script type="module" src="js/bracket-management.js"></script>
  <script>
    document.getElementById('year').innerText = new Date().getFullYear();
  </script>
</body>
</html>
