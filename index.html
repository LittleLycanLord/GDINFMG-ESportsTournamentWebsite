<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDINFMG Esports</title>

  <!-- Bulma CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
  <!-- Custom Theme CSS -->
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation">
    <div class="navbar-brand">
      <a class="navbar-item has-text-weight-bold" href="index.html">GDINFMG Esports</a>
    </div>
    <div class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item" href="index.html">Home</a>
        <a class="navbar-item" href="team-roster.html">Teams</a>
        <a class="navbar-item" href="player-roster.html">Players</a>
        <a class="navbar-item" href="tournament-management.html">Tournament Management</a>
        <a class="navbar-item" href="participant-management.html">Participant Management</a>
        <a class="navbar-item" href="bracket-management.html">Bracket Management</a>
      </div>
    </div>
    <div class="navbar-menu">
      <div class="navbar-end">
        <div class="navbar-item">
          <button class="button is-primary" id="loginBtn">Login</button>
        </div>
        <div class="navbar-item" id="userInfo" style="display:none;">
          <span id="userName"></span>
          <button class="button is-danger" id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero is-medium">
    <div class="hero-body">
      <div class="container has-text-centered">
        <h1 class="title has-text-white">GDINFMG Esports</h1>
        <h2 class="subtitle has-text-grey-light">
          Competitive • Organized • Community-Driven
        </h2>
      </div>
    </div>
  </section>

  <!-- CONTENT SECTION -->
  <section class="section">
    <div class="container">

      <h3 class="title is-4 has-text-white">Upcoming Tournaments</h3>

      <div id="tournament-list">
        <div class="box has-background-dark has-text-white">
          Loading tournaments...
        </div>
      </div>

    </div>
  </section>

  <!-- LOGIN MODAL -->
  <div class="modal" id="loginModal">
    <div class="modal-background"></div>
    <div class="modal-card">
      <header class="modal-card-head has-background-dark">
        <p class="modal-card-title has-text-white">Login / Sign Up</p>
        <button class="delete" id="closeLoginModal"></button>
      </header>
      <section class="modal-card-body has-background-dark">
        <!-- Tabs -->
        <div class="tabs">
          <ul>
            <li class="is-active" id="loginTabLi">
              <a id="loginTab">Login</a>
            </li>
            <li id="signupTabLi">
              <a id="signupTab">Sign Up</a>
            </li>
          </ul>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
          <div class="field">
            <label class="label has-text-white">Username</label>
            <div class="control">
              <input
                class="input"
                type="text"
                id="loginUsername"
                placeholder="Enter username"
              />
            </div>
          </div>

          <div class="field">
            <label class="label has-text-white">Password</label>
            <div class="control">
              <input
                class="input"
                type="password"
                id="loginPassword"
                placeholder="Enter password"
              />
            </div>
          </div>

          <div class="field">
            <div class="control">
              <button class="button is-primary" id="submitLoginBtn">
                Login
              </button>
            </div>
          </div>

          <div id="loginError" class="has-text-danger"></div>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" style="display: none;">
          <div class="field">
            <label class="label has-text-white">Username</label>
            <div class="control">
              <input
                class="input"
                type="text"
                id="signupUsername"
                placeholder="Choose a username"
              />
            </div>
          </div>

          <div class="field">
            <label class="label has-text-white">Password</label>
            <div class="control">
              <input
                class="input"
                type="password"
                id="signupPassword"
                placeholder="Enter password (min 6 chars)"
              />
            </div>
          </div>

          <div class="field">
            <label class="label has-text-white">Confirm Password</label>
            <div class="control">
              <input
                class="input"
                type="password"
                id="signupPasswordConfirm"
                placeholder="Confirm password"
              />
            </div>
          </div>

          <div class="field">
            <div class="control">
              <button class="button is-primary" id="submitSignupBtn">
                Sign Up
              </button>
            </div>
          </div>

          <div id="signupError" class="has-text-danger"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer has-text-centered">
    <p>© <span id="year"></span> GDINFMG Esports Website</p>
  </footer>

  <!-- load frontend as ESM module -->
  <script type="module" src="js/script.js"></script>
  <script>
    document.getElementById('year').innerText = new Date().getFullYear();
  </script>
</body>
</html>
